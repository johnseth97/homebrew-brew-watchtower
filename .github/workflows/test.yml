name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current release metadata
        run: |
          version=$(awk -F'"' '/^readonly VERSION=/{print $2; exit}' bin/brew-watchtower)
          test -n "$version"
          make verify-release VERSION="$version"
      - name: Audit tap formula
        run: |
          brew tap johnseth97/brew-watchtower "$PWD"
          brew trust --formula johnseth97/brew-watchtower/brew-watchtower
          brew audit --formula johnseth97/brew-watchtower/brew-watchtower
